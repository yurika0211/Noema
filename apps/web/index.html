<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>灯織</title>
<style>
:root{
  /* 与 apps/android/.../values/colors.xml 对齐：noema_bg / noema_ink / noema_accent */
  --noema-bg:#f4f1ea;
  --noema-ink:#1c1a16;
  --noema-accent:#355e4b;
  --paper:#fbf8f1;
  --mute:#7a756c;
  --line:#e4ddd0;
  --you:#ebe4d6;
  --stop:#7a3a32;
  --hair:#1a1816;
  --skin:#cfc6b8;
  --shadow:#e8e2d6;
  --dress:#2a4d3e;
  --collar:#f3efe6;
  --eye:#3a3834;
  --pin:#4a8a52;
  --pin-dark:#2f6a38;
  --font-serif:"Iowan Old Style","Palatino Linotype","Songti SC","Noto Serif SC",serif;
  --font-ui:ui-sans-serif,system-ui,sans-serif;
  --space-page:22px;
  --space-block:16px;
  --space-tight:8px;
  --measure:720px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--noema-bg);color:var(--noema-ink);
  font:16px/1.65 var(--font-serif);
}
.app{
  min-height:100%;max-width:var(--measure);margin:0 auto;
  padding:var(--space-page);display:flex;flex-direction:column;gap:var(--space-block);
}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.who b{font:20px/1.2 "Songti SC","Noto Serif SC",serif;font-weight:500;letter-spacing:.12em}
.who small{display:block;margin-top:4px;color:var(--mute);font:11px/1.4 var(--font-ui);letter-spacing:.06em}
.modes{display:flex;gap:14px}
.modes button{
  font:12px/1 var(--font-ui);letter-spacing:.1em;
  border:0;background:transparent;color:var(--mute);padding:4px 0;cursor:pointer;
}
.modes button.on{color:var(--noema-accent);box-shadow:inset 0 -1px 0 var(--noema-accent)}
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:20px;
  min-height:0;
}
.stage.chat{flex-direction:row;align-items:flex-start;gap:28px}
.portrait{
  flex:0 0 168px;width:168px;
  display:flex;flex-direction:column;align-items:center;
}
.portrait svg{width:168px;height:280px;display:block}
.stage.gal{
  position:relative;flex:1;display:flex;flex-direction:column;justify-content:flex-end;
  min-height:62vh;padding:0 0 8px;
}
.stage.gal .portrait{
  position:absolute;inset:0;width:auto;flex:none;
  display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;
}
.stage.gal .portrait svg{width:min(280px,70%);height:auto;max-height:78%}
.log{
  flex:1;min-width:0;width:100%;
  display:flex;flex-direction:column;gap:12px;
  max-height:52vh;overflow:auto;padding:2px 0 4px;
}
.stage.chat .log:empty{display:none}
.stage.gal .log{
  position:relative;z-index:1;max-height:none;overflow:visible;
  min-height:0;gap:0;
}
.stage.gal .log:empty::after{
  content:"……";
  display:block;text-align:center;color:var(--mute);letter-spacing:.4em;padding:18px 0;
}
.bubble{max-width:36em}
.bubble .meta{
  font:11px/1 var(--font-ui);color:var(--mute);
  letter-spacing:.14em;margin:0 0 4px;
}
.bubble .body{margin:0;white-space:pre-wrap}
.bubble.user{margin-left:auto;text-align:right}
.bubble.user .body{
  display:inline-block;background:var(--you);
  padding:8px 12px;border-radius:14px 14px 4px 14px;text-align:left;
}
.stage.gal .bubble.user{display:none}
.stage.gal .bubble.assistant{display:none}
.stage.gal .bubble.assistant.current{
  display:block;
  background:color-mix(in srgb, var(--paper) 92%, transparent);
  padding:16px 18px 14px;width:100%;max-width:none;
}
.stage.gal .bubble.assistant.current .meta{display:none}
.stage.gal .bubble.assistant.current .body{font-size:18px;line-height:1.8}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{
  flex:1;min-height:44px;max-height:120px;resize:none;
  font:15px/1.5 inherit;color:var(--noema-ink);background:transparent;
  border:0;border-bottom:1px solid var(--line);border-radius:0;padding:8px 2px;
  outline:none;
}
.composer textarea:focus{border-bottom-color:var(--noema-accent)}
.stage.gal ~ .composer textarea{text-align:center}
.composer button{
  font:12px/1 var(--font-ui);letter-spacing:.1em;
  border:0;background:transparent;color:var(--noema-accent);padding:var(--space-tight) 4px;cursor:pointer;
}
.composer button.stop{color:var(--stop)}
.note{font:12px/1.5 var(--font-ui);color:var(--mute);min-height:0}
.note.err{color:var(--stop)}
details.setup{
  font:12px/1.5 var(--font-ui);color:var(--mute);
  border-top:1px solid var(--line);padding-top:8px;margin-top:auto;
}
details.setup summary{cursor:pointer;letter-spacing:.08em;list-style:none}
details.setup summary::-webkit-details-marker{display:none}
.setup .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px}
.setup label{display:flex;flex-direction:column;gap:4px}
.setup input,.setup button{
  font:13px/1.4 var(--font-ui);color:var(--noema-ink);
  background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:7px 9px;
}
.setup button{cursor:pointer}
.setup .aside{margin:10px 0 0}
@media(max-width:640px){
  .app{padding:var(--space-block)}
  .stage.chat{flex-direction:column;align-items:center}
  .portrait svg{width:140px;height:230px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="who">
      <b>灯織</b>
      <small id="status">未连接</small>
    </div>
    <nav class="modes" aria-label="显示">
      <button id="mode-chat" class="on" type="button">对话</button>
      <button id="mode-gal" type="button">剧场</button>
    </nav>
  </header>
  <div class="stage chat" id="stage">
    <div class="portrait" aria-hidden="true">
      <svg viewBox="0 0 168 280" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="84" cy="268" rx="46" ry="8" fill="var(--shadow)"/>
        <path fill="var(--dress)" d="M54 168h60l6 92H48z"/>
        <path fill="var(--collar)" d="M58 156h52v28H58z"/>
        <path fill="var(--hair)" d="M84 18c28 2 48 22 52 52 3 22-2 38-10 52 12 8 18 22 16 38-3 24-22 40-46 44-28 4-52-12-58-38-4-18 2-32 12-42C42 110 36 92 40 68 46 36 62 16 84 18z"/>
        <path fill="var(--hair)" d="M38 92c-10 28-8 70 6 108h18c-16-32-22-70-8-108z"/>
        <path fill="var(--hair)" d="M130 92c10 28 8 70-6 108h-18c16-32 22-70 8-108z"/>
        <path fill="var(--skin)" d="M62 78c2 28 10 46 22 50 12-4 20-22 22-50-8-18-36-18-44 0z"/>
        <circle cx="74" cy="98" r="2.4" fill="var(--eye)"/>
        <circle cx="94" cy="98" r="2.4" fill="var(--eye)"/>
        <path fill="var(--pin)" d="M108 58l8-10 4 11-7 4z"/>
        <path fill="var(--pin-dark)" d="M116 48l7 3-2 9-6-2z"/>
      </svg>
    </div>
    <div class="log" id="log"></div>
  </div>
  <form class="composer" id="form">
    <textarea id="draft" placeholder="和她说话" rows="1"></textarea>
    <button id="send" type="submit">发送</button>
    <button id="stop" class="stop" type="button" hidden>停止</button>
  </form>
  <div class="note" id="note"></div>
  <details class="setup">
    <summary>连接</summary>
    <div class="bar">
      <label>WebSocket<input id="ws" value="ws://127.0.0.1:8787/v1/ws" size="28"></label>
      <label>密钥<input id="key" type="password" autocomplete="off" size="16"></label>
      <button id="connect" type="button">连接</button>
    </div>
    <p class="aside">活动、回忆尚未接入。点这里不会写入记忆。</p>
  </details>
</div>
<script src="app.js"></script>
</body>
</html>
